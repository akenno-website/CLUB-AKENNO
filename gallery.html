<!DOCTYPE html>
<html>
<head>
    <title>*** CLUB AKENNO - MEDIA GALLERY ***</title>
    <script>
        // =========================================================
        // ADD ALL YOUR PHOTOS HERE IN ONE PLACE!
        // =========================================================
        var galleryData = [
            { title: "Construction GIF", url: "https://media.giphy.com/media/13Hgw8T855x5za/giphy.gif", isPro: false },
            { title: "Dancing Baby", url: "https://media.giphy.com/media/26tn33PNiAT2A48qQ/giphy.gif", isPro: false },
            { title: "Akenno Custom Pic 1", url: "pic1.png", isPro: true },
            { title: "Akenno Custom Pic 2", url: "pic2.jpg", isPro: true },
            { title: "Secret VIP Flame", url: "https://web.archive.org/web/20090830022830/http://geocities.com/clipart/pagan/flame.gif", isPro: true }
        ];

        function renderGallery() {
    // 1. Grab metadata directly from the URL parameter (e.g., gallery.html?access=pro)
    var urlParams = new URLSearchParams(window.location.search);
    var accessParam = urlParams.get("access");

    // 2. Grant PRO access ONLY if the URL parameter specifically equals "pro"
    var isProAccess = (accessParam === "pro");
    
    var grid = document.getElementById("galleryGrid");
    var notice = document.getElementById("statusNotice");
    var html = "";

    if (isProAccess) {
        notice.innerHTML = "<font color='#00FF00'><b>[ PRO ACCESS UNLOCKED ]</b> Welcome to the VIP Vault! Showing full archive.</font>";
    } else {
        notice.innerHTML = "<font color='#FF0000'><b>[ PLEB MODE ]</b> Showing public images only. <a href='index.html'><font color='#FFFF00'>Login</font></a> for PRO photos.</font>";
    }

    // Loop through all images and render based on the URL flag
    for (var i = 0; i < galleryData.length; i++) {
        var item = galleryData[i];

        // Skip PRO images if access parameter is missing
        if (item.isPro && !isProAccess) {
            continue;
        }

        var badge = item.isPro ? "<font color='#FF00FF'><b>[PRO]</b></font> " : "<font color='#00FFFF'>[PUBLIC]</font> ";

        html += "<td align='center' bgcolor='#000000' style='border: 2px solid #FF00FF; padding: 10px;' valign='top'>";
        html += "<img src='" + item.url + "' style='max-width: 150px; height: auto;'><br><br>";
        html += "<font size='2' color='#FFFF00'>" + badge + "<br>" + item.title + "</font>";
        html += "</td>";
    }

    grid.innerHTML = html;
}
    </script>
</head>
<body bgcolor="#000000" text="#00FF00" link="#FF00FF" vlink="#00FFFF" background="https://www.transparenttextures.com/patterns/stardust.png" onload="renderGallery()">

    <center>
        <font size="6" face="Comic Sans MS, Arial" color="#FFFF00">
            <b>*** CLUB AKENNO MEDIA GALLERY ***</b>
        </font>
        <br><br>
        <marquee scrollamount="8" width="80%">
            <font color="#00FFFF"><b>*** WARNING: HIGH-RESOLUTION GIFS BELOW *** TAKE TIME TO LOAD ON 56k DIAL-UP ***</b></font>
        </marquee>
    </center>

    <hr size="5" color="#FF00FF">

    <table border="5" cellpadding="10" cellspacing="5" width="90%" align="center" bgcolor="#000033">
        <tr>
            <!-- SIDEBAR -->
            <td width="25%" valign="top" bgcolor="#111111">
                <font face="Times New Roman" color="#FFFFFF">
                    <h3><b><u>NAVIGATION</u></b></h3>
                    <ul>
                        <li><a href="index.html">Home / Login</a></li>
                        <li><a href="gallery.html">Media Gallery</a></li>
                        <li><a href="about.html">About Me</a></li>
                    </ul>
                </font>
                <br><hr color="#FF00FF"><br>
                <center>
                    <img src="pic1.png" style="max-width: 75%; height: auto;"><br><br>
                    <img src="pic2.jpg" style="max-width: 75%; height: auto;"><br><br>
                    <font size="1" color="#FF0000">HOT CONTENT INSIDE</font>
                </center>
            </td>

            <!-- MAIN CONTENT -->
            <td width="75%" valign="top">
                <div id="statusNotice" style="background:#111; padding:10px; border:1px solid #00FF00; margin-bottom:15px;"></div>

                <h2><font color="#00FFFF" face="Comic Sans MS">Media Vault</font></h2>
                
                <table cellpadding="8" width="100%">
                    <tr id="galleryGrid">
                        <!-- Dynamic Photos Inject Here -->
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <br><br>
    <center>
        <font color="#FFFFFF" size="2"><i>Club Akenno Unified Gallery &copy; 2026</i></font>
    </center>

</body>
</html>
